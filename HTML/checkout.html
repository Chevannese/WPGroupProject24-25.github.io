<!DOCTYPE html>
<html>

<head><title>Checkout</title>
    <link rel="stylesheet" href="..\CSS\style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/jpg" href="..\Assets\favicon.jpg">
    <script src="..\JS\checkout.js" async></script>
</head>
<style>
    *
    {
        margin:0px;
        padding:0px;
    }
    h1,h2
    {
        text-align: center;
    }
    
</style>
<body>
    <main>
        <div class="container" id="container">
            <div class="box" id="box1">
                <img src="..\Assets\Logo.png" width="300px" height="100%">
            </div>

            <div class="box" id="box2">
                
            </div>
            <div class="box bg-primary-x-light" id="box3">
                <br>
                <span class="iconSize"><i class="fa-solid fa-user" style="color: #74C0FC;"></i></span> <span class="Login">Login</span>
                <br><br><i id = "cart" class="fa-solid fa-cart-shopping" style="color: #FFD43B;"></i>
            </div>
        </div>


        <div class="pagination">
            <header>
              <a href="product.html">Products/Services</a>
              <a href="cart.html">Cart</a>
              <a href="dashboard.html">Dashboard</a>
            </header>
        </div>

        <center>
        <h3 style="margin-top: 20px;"><a href="#Summary">Shopping Cart Summary Below Form</a></h3>
        </center>

        <div class="myForm"><div></div> 
        <form id="shippingForm">
            <img src="..\Assets\Logo.png" style="float:left" width="100px">
            <legend><h2>Shipping Company Form</h2></legend>

            <label for="shippingName">Shipping Company Name:</label>
            <input type="text" name="shippingName" id="shippingName" placeholder="Enter Shipping Company Name" required>

            <label for="shippingAddr">Shipping Address:</label>
            <input type="text" name="shippingAddr" id="shippingAddr" placeholder="Enter Shipping Company Address" required>

            <label for="amount">Amount:</label>
            <input type="number" name="amount" id="amount" placeholder="Enter the amount that will be paid" min="1" value="1" required>
            <button class="submitButton" type="button" onclick="shippingUser()">Confirm</button>
            <button class="cancelButton" type="button" onclick="exitForm()">Cancel</button>
        </form>
        <div></div>
    </div> 


        <div class="myTable">

            <div></div>
            <div style="background-color: white;">
            <table class="content-table">
            <img style="float:left" src="..\Assets\Logo.png" width="50px" height="50px">
            <h1 id="Summary">Summary of Shopping Cart</h1>
                <tr>
                    <th style="text-align: left;">Qty</th>
                    <th style="text-align: left;">Description</th>
                    <th> </th>
                    <th style="text-align: left;">Total</th>
                </tr>
                <tr>
                    <td><span id="quantity"> </span></td>
                    <td><span id="productTitle"></span> </td>
                    <td> </td>
                    <td><span id="total"></span></td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                    <td>Grand-Total</td>
                    <td>$<span id="grandTotal"></span></td>
                </tr>
            </table></div>
            <div></div>
            
        </div>


</main>
</body>

<div class="pagination">
    <footer>
        <a href="product.html">Products/Services</a>
        <a href="cart.html">Cart</a>
        <a href="dashboard.html">Dashboard</a>
    </footer>
</div>
</html>
