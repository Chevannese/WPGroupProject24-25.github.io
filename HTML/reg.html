<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Page</title>
  <link rel="icon" type="image/jpg" href="..\Assets\favicon.jpg">
  <link rel="stylesheet" href="..\CSS\style.css">
</head>
<body>
  
  <form id="registrationForm">
    <img src="..\Assets\Logo.png" style="float:left" width="100px">
    <legend><h2>User Registration</h2></legend>


    <div id="errorContainer" style="color: red;"></div>
    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" placeholder="Enter your First Name" required>

    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" placeholder="Enter your Last Name" required>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" required>

    <label for="gender">Gender:</label>
    <select id="gender" required>
      <option value="">Select</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="Enter your phone number (Format: 123-456-7890)" required>

    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="Enter your email (Format: someone@gmail.com)" required>

    <label for="trn">TRN:</label>
    <input type="tel" id="trn" pattern="[0-9]{3}-[0-9]{3}-[0-9]{3}" placeholder="Enter your TRN (Format: 000-000-000)"required>

    <label for="password">Password:</label>
    <input type="password" id="password" minlength="8" placeholder= "Enter your password (Format: Minimum 8 Characters)" required>

    <button class="submitButton" type="button" onclick="registerUser()">Register</button>
    <button class="cancelButton" type="button" onclick="clearForm()">Cancel</button>
  </form>
</body>
<script src="..\JS\reg.js"></script>
</html>
