<!DOCTYPE html>
<html>

<head><title>Checkout</title>
    <link rel="stylesheet" href="..\CSS\style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/jpg" href="..\Assets\favicon.jpg">
    <script src="..\JS\invoice.js" async></script>
</head>
<style>
    *
    {
        margin:0px;
        padding:0px;
    }
    body {
            font-family: Arial, sans-serif;
            
        }

        
</style>
<body>
    <main>
        <div class="container" id="container">
            <div class="box" id="box1">
                <img src="..\Assets\Logo.png" width="300px" height="100%">
            </div>

            <div class="box" id="box2">
                
            </div>
            <div class="box bg-primary-x-light" id="box3">
                <br>
                <span class="iconSize"><i class="fa-solid fa-user" style="color: #74C0FC;"></i></span> <span class="Login">Login</span>
                <br><br><i id = "cart" class="fa-solid fa-cart-shopping" style="color: #FFD43B;"></i>
            </div>
        </div>

        <div class="pagination">
            <header>
              <a href="product.html">Products/Services</a>
              <a href="cart.html">Cart</a>
              <a href="dashboard.html">Dashboard</a>
            </header>
        </div>


<div class="invoice-container">
    <div class="header">
        <img src="../Assets/Logo.png" class="logo" alt="Logo">
        <div class="store-details">
            <p>Store Name</p>
            <p>Date: <span id="invoiceDate">---</span></p>
            <p>Invoice Num: <span id="invoiceNum">---</span></p>
        </div>
        <div class="shipping-details">
            <p><strong>Shipping Details</strong></p>
            <p>Company: <span id="shippingName">---</span></p>
            <p>Address: <span id="shippingAddr">---</span></p>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Qty</th>
                <th>Description</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody id="itemTable">
            <!-- Items will be populated dynamically -->
        </tbody>
    </table>

    <div class="totals">
        <p>Subtotal: $<span id="subTotal">0.00</span></p>
        <p>GCT (15%): $<span id="gctTotal">0.00</span></p>
        <p>Discount (30%): $<span id="discountTotal">0.00</span></p>
        <h3>Grand Total: $<span id="grandTotal">0.00</span></h3>
    </div>

    <div class="footer">
        <h1 style="font-family: Brush Script MT, Brush Script Std, cursive;text-align: center;">Thank you for your business</h1>
    </div>


</main>
</body>
        <div class="pagination">
            <footer>
              <a href="product.html">Products/Services</a>
              <a href="cart.html">Cart</a>
              <a href="dashboard.html">Dashboard</a>
            </footer>
        </div>
