<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link rel="icon" type="image/jpg" href="..\Assets\favicon.jpg">
  <link rel="stylesheet" href="..\CSS\style.css">
</head>
<body>
  <div class="myForm"><div></div>
  <form id="loginForm">
    <img src="..\Assets\Logo.png" style="float:left" width="100px">
    <legend><h2>Reset Password </h2></legend>
    <div id="errorContainer" style="color: red;"></div>
    <label for="trn">TRN:</label>
    <input type="text" id="trn" placeholder="Enter your TRN (Format: 000-000-000)" required pattern="[0-9]{3}-[0-9]{3}-[0-9]{3}">

    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="Enter your password (Format: Minimum 8 Characters)" required minlength="8">

    <label for="confirmPassword">Confirm Password:</label>
    <input type="password" id="confirmPassword" placeholder="Re-enter your password (Format: Minimum 8 Characters)" required minlength="8">

    <button type="button" class="submitButton" onclick="updatePassword()">Confirm</button>
    <button type="button" class="cancelButton" onclick="clearForm()">Cancel</button>
  </form>
  <div></div>

</div>
</body>
<script src="..\JS\admindata.js"></script>
<script src="..\JS\index.js"></script>
</html>
